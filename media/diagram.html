<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{nonce}}'; style-src {{csp}} 'unsafe-inline'; img-src data:;"><title>Karma diagram</title><link rel="stylesheet" href="{{css}}"></head><body>
