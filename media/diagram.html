<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{nonce}}'; style-src {{csp}} 'unsafe-inline'; img-src data:;"><title>Sutra diagram</title><link rel="stylesheet" href="{{css}}"></head><body>
<header><div><p class="eyebrow">SUTRA / DIAGRAMS</p><h1 id="title">Preparing diagram…</h1><p id="note"></p></div><div class="tools"><select id="view" aria-label="Diagram view" hidden></select><button id="fit">Fit</button><button id="minus" aria-label="Zoom out">−</button><button id="plus" aria-label="Zoom in">+</button><select id="direction" aria-label="Diagram layout"><option value="LR">Horizontal</option><option value="TB">Vertical</option></select><button id="copy">Copy Mermaid</button><button id="export" class="primary">Export SVG</button></div></header>
<main id="viewport"><div id="canvas"></div></main><p id="error" role="alert"></p><footer><span id="provenance">Conceptual diagram · supplied description; relationships are not independently verified.</span><details><summary>Diagram source &amp; receipt</summary><p id="receipt"></p><pre id="source"></pre></details></footer>
